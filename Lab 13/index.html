<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR - Випадкові моделі</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        #ui { 
            position: absolute; top: 15px; left: 15px; z-index: 10; color: white; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; 
            border: 1px solid #ff00ff; pointer-events: none;
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Смульський Артур<br>
        <strong>Група:</strong> І-22<br>
        <strong>Завдання:</strong> Випадкові моделі (Подія Select)<br>
        <em>Наведіть на підлогу та тапніть по екрану</em>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let container, camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        // Масив для збереження розміщених об'єктів (щоб їх анімувати)
        const placedObjects = [];

        init();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Вмикаємо WebXR
            container.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // --- ОСНОВНА ЛОГІКА ЗАВДАННЯ: ПОДІЇ КОНТРОЛЕРА ---
            controller = renderer.xr.getController(0);
            // Слухаємо подію 'select' (тап по екрану)
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Приціл
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xff00ff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        // Функція, що викликається при тапі
        function onSelect() {
            if (reticle.visible) {
                // 1. Створюємо список з різних геометричних форм
                const geometries = [
                    new THREE.BoxGeometry(0.15, 0.15, 0.15),                   // Куб
                    new THREE.SphereGeometry(0.1, 32, 32),                     // Сфера
                    new THREE.ConeGeometry(0.1, 0.2, 32),                      // Конус
                    new THREE.CylinderGeometry(0.1, 0.1, 0.2, 32),             // Циліндр
                    new THREE.TorusGeometry(0.1, 0.04, 16, 50)                 // Тор (бублик)
                ];

                // 2. Обираємо випадкову форму за допомогою Math.random()
                const randomIndex = Math.floor(Math.random() * geometries.length);
                const selectedGeometry = geometries[randomIndex];

                // MeshNormalMaterial красиво переливається кольорами без складного освітлення
                const material = new THREE.MeshNormalMaterial(); 
                const mesh = new THREE.Mesh(selectedGeometry, material);
                
                // 3. Розміщуємо об'єкт там, де знаходиться приціл
                mesh.position.setFromMatrixPosition(reticle.matrix);
                
                // Додаємо трохи випадковості у початковий поворот
                mesh.rotation.x = Math.random() * Math.PI;
                mesh.rotation.y = Math.random() * Math.PI;
                
                scene.add(mesh);
                placedObjects.push(mesh); // Зберігаємо для анімації
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(timestamp, frame) {
            // Обертаємо всі розміщені об'єкти
            placedObjects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.02;
            });

            // Логіка Hit Test
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function() {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
