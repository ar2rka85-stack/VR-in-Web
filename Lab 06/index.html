<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Сцена - Океан та Корабель на одному маркері</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; color: white; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; border: 1px solid #00aaff; }
        #startButton { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 15px 30px; background-color: #00aaff; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        #startButton:hover { background-color: #0088cc; }
        
        #oceanVideo { display: none; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Смульський Артур<br>
        <strong>Група:</strong> І-22<br>
        <strong>Завдання 6:</strong> Відео та корабель (один маркер)<br>
        <em>Покажіть один маркер і натискайте на корабель</em>
    </div>
    
    <video id="oceanVideo" src="ocean.mp4" loop crossorigin="anonymous" playsinline></video>
    
    <button id="startButton">Увімкнути AR-камеру</button>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // КРОК 1: maxTrack: 1 (відстежуємо один тип маркера)
        const mindarThree = new MindARThree({
            container: document.querySelector("#container"),
            imageTargetSrc: "targets.mind", // Повинен бутиTargets файл з однією картинкою
            maxTrack: 1 
        });
        const {renderer, scene, camera} = mindarThree;

        // КРОК 2: Використовуємо ТІЛЬКИ anchor0
        const anchor0 = mindarThree.addAnchor(0); 

        // Освітлення
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(0, 5, 5);
        scene.add(dirLight);

        // === ОКЕАНСЬКЕ ВІДЕО ===
        const video = document.getElementById('oceanVideo');
        const videoTexture = new THREE.VideoTexture(video);
        const videoMaterial = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
        
        // Площина для відео. Робимо її меншою (w: 1, h: 0.5625) і зміщуємо вліво
        const videoPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.5625), videoMaterial);
        videoPlane.position.set(-0.6, 0, 0); // Зсув вліво на 0.6 одиниці
        anchor0.group.add(videoPlane); // Додаємо до anchor0

        // Керування відео: грати/пауза, коли маркер з'являється або зникає
        anchor0.group.addEventListener("targetFound", () => { video.play(); });
        anchor0.group.addEventListener("targetLost", () => { video.pause(); });

        // === МОДЕЛЬ КОРАБЛЯ ===
        const gltfLoader = new GLTFLoader();
        let shipModel;

        gltfLoader.load('ship.glb', (gltf) => {
            shipModel = gltf.scene;
            // ПАМ'ЯТАЙТЕ: налаштуйте масштаб (scale), якщо ваш корабель завеликий чи замалий!
            // Для цієї сцени ми робимо його меншим і зміщуємо вправо.
            shipModel.scale.set(0.08, 0.08, 0.08); 
            shipModel.position.set(0.6, 0, 0);   // Зсув вправо на 0.6 одиниці
            anchor0.group.add(shipModel); // Додаємо до anchor0
        });

        // === ВЗАЄМОДІЯ: КЛІК ПО КОРАБЛЮ (Raycaster) ===
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            // Переводимо координати кліку в зрозумілі для 3D простору
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Випускаємо "промінь" від камери до місця кліку
            raycaster.setFromCamera(mouse, camera);

            // КРОК 3: Перевіряємо влучання по кораблю на єдиному anchor0
            if (shipModel && anchor0.group.visible) {
                const intersects = raycaster.intersectObject(shipModel, true);
                
                if (intersects.length > 0) {
                    // Випадковий кут від 45 до 90 градусів
                    const randomAngleDeg = Math.random() * (90 - 45) + 45;
                    const randomAngleRad = THREE.MathUtils.degToRad(randomAngleDeg);
                    
                    // Повертаємо корабель навколо вісі Z
                    shipModel.rotation.z += randomAngleRad;
                }
            }
        });

        const startButton = document.querySelector("#startButton");
        startButton.addEventListener("click", async () => {
            startButton.style.display = "none";
            // Потрібно для браузерів, щоб дозволити аудіо/відео після кліку
            video.play(); video.pause(); 
            
            await mindarThree.start();
            
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        });
    </script>
</body>
</html>
