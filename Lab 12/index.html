<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR - Довільний об'єкт у довкіллі</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* Інформаційна панель */
        #ui { 
            position: absolute; top: 15px; left: 15px; z-index: 10; color: white; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; 
            border: 1px solid #00ffcc; pointer-events: none;
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Смульський Артур<br>
        <strong>Група:</strong> І-22<br>
        <strong>Завдання:</strong> WebXR + ARButton (Hit Test)<br>
        <em>Наведіть на підлогу та тапніть по екрану</em>
    </div>

    <script type="module">
        import * as THREE from 'three';
        // Імпортуємо ARButton
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let container, camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        // Масив для зберігання всіх наших кубиків (щоб їх анімувати)
        const objects = [];

        init();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Налаштування рендерера
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // ВМИКАЄМО WebXR
            container.appendChild(renderer.domElement);

            // Додаємо кнопку AR із запитом на сканування поверхонь (hit-test)
            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // Контролер для відстеження дотиків (тапів)
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Створюємо "приціл" (зелене кільце), який бігатиме по підлозі
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00ffcc })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
            
            // Запуск циклу анімації
            renderer.setAnimationLoop(render);
        }

        // Функція, яка спрацьовує при тапі по екрану
        function onSelect() {
            if (reticle.visible) {
                // Створюємо довільний об'єкт: Кубик
                const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                // MeshNormalMaterial автоматично переливається всіма кольорами веселки
                const material = new THREE.MeshNormalMaterial(); 
                const mesh = new THREE.Mesh(geometry, material);
                
                // Ставимо кубик точно в те місце, де зараз знаходиться приціл
                mesh.position.setFromMatrixPosition(reticle.matrix);
                mesh.rotation.y = Math.random() * Math.PI; // Випадковий кут
                
                scene.add(mesh);
                objects.push(mesh); // Додаємо до масиву
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Головний цикл відмальовування
        function render(timestamp, frame) {
            // Анімуємо всі кубики, які ми поставили
            objects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.02;
            });

            // Логіка сканування поверхонь (Hit Test)
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function() {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        // Прив'язуємо приціл до фізичної поверхні (підлоги/стола)
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
