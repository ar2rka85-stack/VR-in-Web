<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR - Кастомний приціл та модель</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        #ui { 
            position: absolute; top: 15px; left: 15px; z-index: 10; color: white; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; 
            border: 1px solid #ffcc00; pointer-events: none;
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Смульський Артур<br>
        <strong>Група:</strong> І-22<br>
        <strong>Завдання:</strong> Кастомний приціл (текстура) та модель
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        let container, camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        const placedObjects = [];

        init();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Освітлення для гарного відображення моделі
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(-1, 2, 1);
            scene.add(dirLight);

            // Налаштування рендерера
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

            // Контролер (для обробки тапів по екрану)
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // === СТВОРЕННЯ КАСТОМНОГО ПРИЦІЛУ З НАПІВПРОЗОРОЮ ТЕКСТУРОЮ ===
            
            // 1. Створюємо Canvas у пам'яті для малювання прицілу
            const reticleCanvas = document.createElement('canvas');
            reticleCanvas.width = 256;
            reticleCanvas.height = 256;
            const ctx = reticleCanvas.getContext('2d');
            
            // 2. Малюємо красивий приціл (коло + хрестик)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.8)'; // Напівпрозорий бірюзовий колір
            ctx.lineWidth = 12;
            
            // Коло
            ctx.beginPath();
            ctx.arc(128, 128, 100, 0, Math.PI * 2);
            ctx.stroke();
            
            // Вертикальна лінія
            ctx.beginPath();
            ctx.moveTo(128, 0); ctx.lineTo(128, 60);
            ctx.moveTo(128, 196); ctx.lineTo(128, 256);
            ctx.stroke();
            
            // Горизонтальна лінія
            ctx.beginPath();
            ctx.moveTo(0, 128); ctx.lineTo(60, 128);
            ctx.moveTo(196, 128); ctx.lineTo(256, 128);
            ctx.stroke();

            // 3. Перетворюємо Canvas на текстуру Three.js
            const reticleTexture = new THREE.CanvasTexture(reticleCanvas);

            // 4. Створюємо площину (Plane) і накладаємо цю текстуру
            const reticleGeo = new THREE.PlaneGeometry(0.2, 0.2).rotateX(-Math.PI / 2);
            const reticleMat = new THREE.MeshBasicMaterial({ 
                map: reticleTexture, 
                transparent: true, // Вмикаємо напівпрозорість
                depthTest: false   // Щоб приціл завжди було видно поверх підлоги
            });

            reticle = new THREE.Mesh(reticleGeo, reticleMat);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        // Що відбувається при натисканні (Тап по екрану)
        function onSelect() {
            if (reticle.visible) {
                // Замість куба створюємо складнішу "довільну" модель - Тороїдальний вузол
                const geometry = new THREE.TorusKnotGeometry(0.08, 0.02, 100, 16);
                
                // Золотий блискучий матеріал
                const material = new THREE.MeshStandardMaterial({ 
                    color: 0xffaa00, 
                    roughness: 0.2, 
                    metalness: 0.8 
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                
                // Розміщуємо модель у центрі нашого нового прицілу
                mesh.position.setFromMatrixPosition(reticle.matrix);
                // Трохи піднімаємо об'єкт над підлогою
                mesh.position.y += 0.1;
                
                scene.add(mesh);
                placedObjects.push(mesh);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(timestamp, frame) {
            // Обертаємо розміщені моделі
            placedObjects.forEach(obj => {
                obj.rotation.x += 0.01;
                obj.rotation.y += 0.02;
            });

            // Логіка сканування поверхонь (Hit Test)
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function(referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function(source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function() {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
