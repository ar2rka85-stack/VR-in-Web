<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жестове управління Роботом</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: 'Segoe UI', sans-serif; color: white; }
        
        /* 3D Сцена */
        #container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Відео з камери (маленьке в кутку) */
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 240px; height: 180px; z-index: 10; border: 3px solid #00aaff; border-radius: 10px; overflow: hidden; transform: scaleX(-1); background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Інтерфейс */
        #ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 10px; border: 1px solid #00aaff; }
        #status { font-size: 24px; font-weight: bold; color: #00ffcc; margin-top: 10px; }
        
        /* Кнопка старту */
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; padding: 20px 40px; background: #00aaff; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
        #start-btn:hover { background: #0088cc; }
        #loader { display: none; margin-top: 10px; font-size: 16px; color: #ffcc00; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
    <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.1.0/dist/fingerpose.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <button id="start-btn">Увімкнути Камеру та ШІ <div id="loader">Завантаження моделей (може тривати 10-15 сек)...</div></button>

    <div id="ui">
        <strong>Керування Жестами:</strong><br>
        ✌️ V-знак = Танцювати<br>
        👍 Клас = Показати клас<br>
        ✋ Відкрита долоня = Махати<br>
        ✊ Кулак = Удар<br>
        <div id="status">Жест: Немає (Idle)</div>
    </div>

    <div id="video-container">
        <video id="video" playsinline></video>
    </div>

    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, clock, mixer, robot;
        let actions = {}, activeAction, previousAction;
        let handposeModel, gestureEstimator;

        const video = document.getElementById('video');
        const statusText = document.getElementById('status');

        document.getElementById('start-btn').addEventListener('click', async (e) => {
            e.target.style.pointerEvents = "none";
            document.getElementById('loader').style.display = "block";
            await initEverything();
            e.target.style.display = "none";
        });

        async function initEverything() {
            // 1. Ініціалізація Three.js
            initThreeJS();

            // 2. Ініціалізація Камери
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            video.srcObject = stream;
            await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); } });

            // 3. Створення кастомних жестів для Fingerpose
            // Жест: Відкрита долоня (Paper)
            const paperGesture = new fp.GestureDescription('paper');
            for(let finger of [fp.Finger.Thumb, fp.Finger.Index, fp.Finger.Middle, fp.Finger.Ring, fp.Finger.Pinky]) {
                paperGesture.addCurl(finger, fp.FingerCurl.NoCurl, 1.0);
            }
            // Жест: Кулак (Rock)
            const rockGesture = new fp.GestureDescription('rock');
            for(let finger of [fp.Finger.Thumb, fp.Finger.Index, fp.Finger.Middle, fp.Finger.Ring, fp.Finger.Pinky]) {
                rockGesture.addCurl(finger, fp.FingerCurl.FullCurl, 1.0);
                rockGesture.addCurl(finger, fp.FingerCurl.HalfCurl, 0.9);
            }

            // 4. Ініціалізація ШІ та Fingerpose
            handposeModel = await handpose.load();
            gestureEstimator = new fp.GestureEstimator([
                fp.Gestures.VictoryGesture,  // ✌️
                fp.Gestures.ThumbsUpGesture, // 👍
                paperGesture,                // ✋
                rockGesture                  // ✊
            ]);

            // Запуск розпізнавання
            detectGesture();
        }

        function initThreeJS() {
            const container = document.getElementById('container');
            clock = new THREE.Clock();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            scene.fog = new THREE.Fog(0x222222, 10, 50);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.25, 100);
            camera.position.set(-5, 3, 10);
            camera.lookAt(0, 2, 0);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(0, 20, 10);
            scene.add(dirLight);

            // Підлога
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshPhongMaterial({ color: 0x333333, depthWrite: false }));
            mesh.rotation.x = -Math.PI / 2;
            scene.add(mesh);

            // Завантаження Робота
            const loader = new GLTFLoader();
            loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r161/examples/models/gltf/RobotExpressive/RobotExpressive.glb', function (gltf) {
                robot = gltf.scene;
                scene.add(robot);

                mixer = new THREE.AnimationMixer(robot);

                // Записуємо всі анімації робота у словник
                const animations = gltf.animations;
                animations.forEach(clip => {
                    actions[clip.name] = mixer.clipAction(clip);
                });

                // Стартова анімація
                activeAction = actions['Idle'];
                activeAction.play();
            });

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            renderer.setAnimationLoop(animate);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Плавний перехід між анімаціями
        function fadeToAction(name, duration = 0.5) {
            if (!actions[name] || activeAction === actions[name]) return;

            previousAction = activeAction;
            activeAction = actions[name];

            previousAction.fadeOut(duration);
            activeAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(duration).play();
        }

        let currentGesture = "Idle";

        async function detectGesture() {
            // Шукаємо руки на відео
            const predictions = await handposeModel.estimateHands(video);

            if (predictions.length > 0) {
                // Якщо руку знайдено, передаємо її точки у Fingerpose
                const estimatedGestures = gestureEstimator.estimate(predictions[0].landmarks, 8.5); // 8.5 - поріг впевненості

                if (estimatedGestures.gestures.length > 0) {
                    // Знаходимо жест із найвищою впевненістю
                    const bestGesture = estimatedGestures.gestures.reduce((p, c) => (p.score > c.score) ? p : c);
                    
                    if (currentGesture !== bestGesture.name) {
                        currentGesture = bestGesture.name;
                        
                        // Логіка перемикання анімацій
                        if (currentGesture === 'victory') {
                            fadeToAction('Dance');
                            statusText.innerText = "Жест: ✌️ V-знак (Dance)";
                        } else if (currentGesture === 'thumbs_up') {
                            fadeToAction('ThumbsUp');
                            statusText.innerText = "Жест: 👍 Клас (ThumbsUp)";
                        } else if (currentGesture === 'paper') {
                            fadeToAction('Wave');
                            statusText.innerText = "Жест: ✋ Відкрита долоня (Wave)";
                        } else if (currentGesture === 'rock') {
                            fadeToAction('Punch');
                            statusText.innerText = "Жест: ✊ Кулак (Punch)";
                        }
                    }
                }
            } else {
                // Якщо рук в кадрі немає - повертаємо робота у спокійний стан
                if (currentGesture !== 'Idle') {
                    currentGesture = 'Idle';
                    fadeToAction('Idle');
                    statusText.innerText = "Жест: Немає (Idle)";
                }
            }

            // Запускаємо перевірку наступного кадру
            requestAnimationFrame(detectGesture);
        }

        function animate() {
            const dt = clock.getDelta();
            if (mixer) mixer.update(dt);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
